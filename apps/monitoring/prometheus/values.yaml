prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    retention: 7d
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    ruleSelector: {}
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

    alertmanagerConfigSelector:
      matchLabels:
        alertmanagerConfig: podinfo-discord

    alertmanagerConfigNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring

extraManifests:
  - apiVersion: monitoring.coreos.com/v1alpha1
    kind: AlertmanagerConfig
    metadata:
      name: podinfo-discord
      namespace: monitoring
      labels:
        alertmanagerConfig: podinfo-discord
    spec:
      route:
        groupBy:
          - namespace
          - service
          - severity
          - alertname
        groupWait: 10s
        groupInterval: 1m
        repeatInterval: 30m
        receiver: podinfo-discord
        matchers:
          - name: service
            value: podinfo
            matchType: "="
      receivers:
        - name: podinfo-discord
          discordConfigs:
            - sendResolved: true
              apiURL:
                name: podinfo-alert-discord-webhook
                key: url
              title: '{{ .CommonLabels.alertname }}'
              message: |
                [{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}

                severity: {{ .CommonLabels.severity }}
                namespace: {{ .CommonLabels.namespace }}
                service: {{ .CommonLabels.service }}

                {{ .CommonAnnotations.description }}

grafana:
  adminPassword: admin
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: 
      - grafana.example.com
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
