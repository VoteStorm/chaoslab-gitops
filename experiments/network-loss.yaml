apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: podinfo-network-loss
  namespace: chaos-mesh
spec:
  action: loss
  mode: one
  duration: "2m"
  selector:
    namespaces:
      - podinfo
    labelSelectors:
      app.kubernetes.io/name: podinfo
  loss:
    loss: "50"
    correlation: "50"